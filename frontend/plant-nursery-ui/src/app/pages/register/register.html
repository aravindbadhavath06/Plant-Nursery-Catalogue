<div class="register-page">
  <a routerLink="/" class="brand">🌿 Plant Nursery Catalogue</a>

  <div class="register-card">
    <div class="plant-icon">🌱</div>
    <h1>Create Account</h1>
    <p class="subtitle">Join us and bring more greenery into your life.</p>

    <form (ngSubmit)="register()" #registerForm="ngForm">
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text"
        [(ngModel)]="name" placeholder="Enter your full name" required />

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email"
        [(ngModel)]="email" placeholder="Enter your email" required email />

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        [(ngModel)]="password" placeholder="Minimum 6 characters"
        required minlength="6" />

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword" type="password"
        [(ngModel)]="confirmPassword" placeholder="Re-enter your password"
        required />

      <button type="submit">Create Account</button>

      <p class="message" *ngIf="message">{{ message }}</p>
    </form>

    <p class="login-text">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

    <a routerLink="/" class="back-link">← Back to Home</a>
  </div>
</div>
